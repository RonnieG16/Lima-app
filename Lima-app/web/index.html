<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ugx = n => 'UGX ' + Number(n).toLocaleString('en-UG');
const one = x => Array.isArray(x) ? x[0] : x;
let DELIVERY_FEE = 3000, RIDER_SHARE = 0.9, FEE_PCT = 5;   // overwritten from site_settings by loadSettings()
const STAGES = ['Placed','Paid (escrow)','Accepted','Ready','In transit','Delivered','Confirmed'];
const CATS = ['Grains','Vegetables','Fruits','Tubers','Cash crops','Other'];
const CAT_ICON = { Grains:'🌽', Vegetables:'🍅', Fruits:'🍌', Tubers:'🥔', 'Cash crops':'☕', Other:'🧺' };

    throw new Error('bad file');

  const path = `${me.user_id}/${kind}-${Date.now()}.${ext}`;

}

// The browser never marks an order as paid. pay-start creates a Pesapal checkout; the pay-webhook function
// moves the order to "Paid (escrow)" after Pesapal confirms. This window just waits and watches the order.
function openPay(orders, onPaid) {
  const queue = (Array.isArray(orders) ? orders : [orders]).map(o => ({ id: o.id, total_ugx: +o.total_ugx || 0 }));
  document.getElementById('pay-modal')?.remove();
  const wrap = document.createElement('div'); wrap.id = 'pay-modal'; wrap.className = 'paybg';
  wrap.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-label="Pay with Pesapal"><div class="sub"><h3>Pay with Pesapal</h3><button type="button" class="alt xbtn" id="pay-x" aria-label="Close">✕</button></div><div id="pay-body"></div></div>';
  document.body.appendChild(wrap);
  const body = wrap.querySelector('#pay-body');
  let timer = null, i = 0;
  const sum = () => queue.slice(i).reduce((a, o) => a + o.total_ugx, 0);
  const stop = () => { if (timer) clearInterval(timer); timer = null; };
  const close = () => { stop(); wrap.remove(); };
  wrap.querySelector('#pay-x').onclick = () => { close(); route(); };

  function showForm(msg) {
    stop();
    const left = queue.length - i;
    body.innerHTML = `<p style="margin:.6rem 0">Amount: <b>${ugx(sum())}</b></p>
      ${queue.length > 1 ? `<p class="muted" style="margin:0 0 .4rem">${left} order${left > 1 ? 's' : ''} to pay. Each order is checked out separately.</p>` : ''}
      ${msg ? `<p class="tag bad" style="margin:.5rem 0 0">${esc(msg)}</p>` : ''}
      <button type="button" id="pay-go">Continue to Pesapal secure checkout</button>
      <p class="muted" style="margin:.6rem 0 0">Pesapal sandbox checkout. Payment details are entered on Pesapal, not stored by Lima.</p>`;
    body.querySelector('#pay-go').onclick = () => { body.querySelector('#pay-go').disabled = true; charge(); };
  }
  async function charge() {
    const { data, error } = await sb.functions.invoke('pay-start', { body: { order_id: queue[i].id } });
    if (error) {
      let m = 'Could not start the Pesapal checkout. Please try again.';
      try { const j = await error.context.json(); if (j.error) m = j.error; } catch {}
      return showForm(m);
    }
    if (!data?.redirect) return showForm('Pesapal did not return a checkout link. Please try again.');
    showWaiting(data.redirect);
  }
  function showWaiting(link) {
    const of = queue.length > 1 ? ` <span class="muted">(order ${i + 1} of ${queue.length}, ${ugx(queue[i].total_ugx)})</span>` : '';
    body.innerHTML = `<p style="margin:.6rem 0 .3rem"><b>Waiting for approval…</b>${of}</p>
      ${link ? `<p class="muted" style="margin:0 0 .5rem">Continue to Pesapal’s hosted checkout, choose a supported payment method, complete payment there, then return to Lima.</p><a class="btnlink" href="${esc(link)}" target="_blank" rel="noopener"><button type="button">Continue to approve payment</button></a>`
             : '<p class="muted" style="margin:0">Complete the payment on Pesapal’s secure checkout page, then return to this window.</p>'}
      <p class="muted" style="margin:.6rem 0 0">Keep this window open. It updates by itself.</p>`;
    let tries = 0;
    stop();
    timer = setInterval(async () => {
      tries++;
      const { data } = await sb.from('orders').select('payment_status,stage').eq('order_id', queue[i].id).single();
      if (data?.payment_status === 'paid' || data?.stage >= 2) {
        stop();
        if (i < queue.length - 1) { i++; charge(); } else { showReceipt(data); if (onPaid) onPaid(); }
      }
      else if (data?.payment_status === 'failed') showForm('The payment was declined or cancelled. You can try again.');
      else if (tries > 60) showForm('No response yet. If you approved the payment, wait a moment and check your orders. Otherwise try again.');
    }, 3000);
  }
  function showReceipt(d) {
    const all = queue.reduce((a, o) => a + o.total_ugx, 0);
    body.innerHTML = `<p style="margin:.6rem 0 .3rem"><span class="tag">Payment received</span></p>
      <p style="margin:.3rem 0">${ugx(all)} ${queue.length > 1 ? 'for ' + queue.length + ' orders is' : 'is'} held in escrow until you confirm delivery.</p>
      <button type="button" id="pay-done">Done</button>`;
    body.querySelector('#pay-done').onclick = () => { close(); route(); };
  }
  showForm();
}

async function route() {
  nav(); $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
  const [, p, id] = (location.hash || '#/').split('/');
  try {
    if (recovering) return viewNewPw();
    if (p === 'logout') { await sb.auth.signOut(); me = null; subscribeAlerts(); startLive(); location.hash = '#/'; return; }
    if (!me) {   // guests can look around like on any shop site; signing in is only needed to buy or sell
      if (p === 'market') return await viewMarket();
      if (p === 'prices') return await viewPrices();
      if (p === 'listing') return await viewListing(id);
      if (!p) return await viewHome();
      if (p === 'cart') { NEXT = '#/cart'; return viewAuth('login'); }
      return viewAuth(p === 'register' ? 'register' : 'login');
    }
    if (!me.onboarded) return viewOnboard();
    if (!me.phone_verified) return viewVerify();
    if (me.role === 'agent' && me.approval_status !== 'approved') return viewAgentPending();
    const farm = ['farmer', 'agent'].includes(me.role);
    if (p === 'market') return await viewMarket();
    if (p === 'prices') return await viewPrices();
    if (p === 'sell' && farm) return await viewSell();
    if (p === 'sales' && me.role === 'farmer') return await viewSales();
    if (p === 'earnings' && me.role === 'rider') return await viewEarnings();
    if (p === 'orders') return await viewOrders();
    if (p === 'admin' && me.role === 'admin') return await viewAdmin(id);
    if (p === 'listing') return await viewListing(id);
    if (p === 'cart' && me.role === 'buyer') return await viewCart();
    if (p === 'saved' && me.role === 'buyer') return await viewSaved();
    if (p === 'inbox') return await viewInbox();
    if (p === 'profile') return viewProfile();
    if (p === 'receipt') return await viewReceipt(id);
    if (p === 'weather') return await viewWeather();
    if (p === 'settings') return await viewSettings();
    return await viewHome();
  } catch (e) { if (!e.message?.includes('bad file')) console.error(e);
    if (/failed to fetch|network/i.test(e?.message || '')) $app.innerHTML = '<div class="card"><h3>Can’t reach Lima’s server</h3><p class="muted">Check your internet connection, then try again.</p><button type="button" data-act="retry">Try again</button></div>'; }
}

// ---------- shared listing cards
async function enrich(rows) {
  const ids = [...new Set(rows.map(l => l.farmer_id))];
  const profs = ids.length ? await run(sb.from('public_profiles').select('*').in('user_id', ids)) : [];
  const rts = ids.length ? await run(sb.from('ratings').select('ratee_id,stars').in('ratee_id', ids)) : [];
  const wish = me?.role === 'buyer' ? new Set((await run(sb.from('wishlist').select('listing_id'))).map(w => w.listing_id)) : new Set();
  const here = ORIGIN?.c || townInfo(me?.town)?.c;
  rows.forEach(l => { const r = rts.filter(x => x.ratee_id === l.farmer_id);
    l.nr = r.length; l.avg = r.length ? r.reduce((a, b) => a + b.stars, 0) / r.length : 0;
    l.fname = profs.find(p => p.user_id === l.farmer_id)?.name || 'Farmer'; l.dist = km(here, townInfo(l.town)?.c); l.wish = wish.has(l.listing_id); });
  return rows;
}

let leafletP = null;
function loadLeaflet() {   // OpenStreetMap tiles via Leaflet from cdnjs; needs internet
  if (window.L) return Promise.resolve();
  return leafletP ||= new Promise((ok, no) => {
    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    const j = document.createElement('script'); j.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; j.onload = ok; j.onerror = () => { leafletP = null; no(); }; document.head.appendChild(j);
  });
}
async function drawMap(rows) {
  const box = document.getElementById('mapbox');
  try { await loadLeaflet(); } catch { box.innerHTML = '<div class="card muted">The map needs an internet connection. The list below still works.</div>'; return; }
  box.innerHTML = '<div id="map" role="img" aria-label="Map of matching listings by town"></div>';
  const map = L.map('map'), pts = [];
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);
  const byTown = {}; rows.forEach(l => (byTown[l.town] ||= []).push(l));
  for (const [t, ls] of Object.entries(byTown)) {
    const c = townInfo(t)?.c; if (!c) continue; pts.push(c);
    const html = `<b>${esc(t)}</b><br>` + ls.slice(0, 6).map(l => `<a href="#/listing/${esc(l.listing_id)}">${esc(l.produce)} · ${ugx(l.price_ugx)}/kg</a>`).join('<br>') + (ls.length > 6 ? `<br>+${ls.length - 6} more` : '');
    L.marker(c).addTo(map).bindPopup(html);
  }
  const here = ORIGIN?.c || townInfo(me?.town)?.c;
  if (here) { L.circleMarker(here, { radius: 8, color: '#b3261e', fillOpacity: .8 }).addTo(map).bindTooltip('You'); pts.push(here); }
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 11 }); else map.setView([1.37, 32.29], 6);
}

async function viewOrders() {
  const orders = await run(sb.from('orders').select('*, listings(produce,price_ugx,town,farmer_id,posted_by), payments(*), disputes(*)').order('created_at', { ascending: false }));
  const rated = me.role === 'buyer' ? (await run(sb.from('ratings').select('order_id').eq('rater_id', me.user_id))).map(r => r.order_id) : [];
  const unpaidList = orders.filter(o => o.buyer_id === me.user_id && o.stage === 1 && o.status === 'open')
    .map(o => ({ id: o.order_id, total_ugx: Math.round(Number(o.qty_kg) * Number(o.listings?.price_ugx || 0) + Number(o.delivery_fee_ugx || 0)) }));
  const unpaid = unpaidList.length, unpaidSum = unpaidList.reduce((a, o) => a + o.total_ugx, 0);
  const card = o => {
    const l = o.listings || {}, p = one(o.payments), d = one(o.disputes), open = o.status === 'open', a = [];
    const mineFarm = l.farmer_id === me.user_id || l.posted_by === me.user_id;
    if (me.role === 'buyer' && o.buyer_id === me.user_id) {
      if (o.stage === 1 && open) a.push(btn('pay', o.order_id, 'Pay with Pesapal', '', `data-total="${Math.round(Number(o.qty_kg) * Number(l.price_ugx || 0) + Number(o.delivery_fee_ugx || 0))}"`));
      if (o.stage === 6 && open) a.push(btn('confirm', o.order_id, 'Confirm I received it'));
      if ([5, 6].includes(o.stage) && open) a.push(btn('report', o.order_id, 'Report a problem', 'danger'));
      if (o.status === 'completed') a.push(btn('reorder', o.order_id, 'Order again', 'alt', `data-listing="${esc(o.listing_id)}" data-qty="${esc(o.qty_kg)}"`));
      if (o.status === 'completed' && !rated.includes(o.order_id)) a.push(`<label>Rate the farmer</label><select>${[5, 4, 3, 2, 1].map(n => `<option>${n}</option>`).join('')}</select><label>Review (optional)</label><textarea rows="2" maxlength="300"></textarea>` + btn('rate', o.order_id, 'Send rating', '', `data-ratee="${esc(l.farmer_id)}"`));
    }
    if (['farmer', 'agent'].includes(me.role) && mineFarm && open) {
      if (o.stage === 2) a.push(btn('accept', o.order_id, 'Accept order'));
      if (o.stage === 3) a.push(btn('ready', o.order_id, 'Mark ready'));
      if (o.stage === 4 && o.mode === 'pickup') a.push(btn('handover', o.order_id, 'Handed over to buyer'));
    }
    if (me.role === 'rider' && open) {
      if (o.stage === 4 && o.mode === 'delivery') a.push(btn('collect', o.order_id, 'Collect for delivery'));
      if (o.stage === 5) a.push(btn('deliver', o.order_id, 'Mark delivered'));
    }
    const money = !p ? (me.role === 'rider' ? ` · delivery fee ${ugx(o.delivery_fee_ugx)}` : '')
      : me.role === 'buyer' ? ` · total ${ugx(p.amount_ugx)}${o.delivery_fee_ugx > 0 ? ' (incl. delivery ' + ugx(o.delivery_fee_ugx) + ')' : ''}`
      : ` · sale ${ugx(p.amount_ugx - o.delivery_fee_ugx)} (fee ${ugx(p.fee_ugx)})`;
    return `<div class="card" data-order="${esc(o.order_id)}"><b>${esc(l.produce)}</b> · ${esc(o.qty_kg)} kg · ${esc(o.mode)}
      <span class="tag ${o.status === 'cancelled' ? 'bad' : o.status === 'disputed' ? 'warn' : ''}">${esc(o.status)}</span>${stepBar(o.stage)}
      <div class="muted">${STAGES[o.stage - 1]}${p ? ` · escrow: <b>${esc(p.status)}</b>` : ''}${money}${d ? ` · dispute: ${esc(d.status)}` : ''}
      ${o.stage === 6 && open ? '<br>If you do nothing, payment is released automatically 48 hours after delivery.' : ''}</div>
      <div class="acts">${a.join('')}</div>
      <div class="row noprint">${btn('msgs', o.order_id, '💬 Messages', 'alt')}${o.status === 'completed' && (o.buyer_id === me.user_id || mineFarm) ? `<a class="btnlink" href="#/receipt/${esc(o.order_id)}"><button type="button" class="alt">Receipt</button></a>` : ''}</div>
      <div class="msgbox"></div></div>`;
  };
  $app.innerHTML = `<h2>Orders</h2>${unpaid > 1 ? `<div class="card">${btn('payall', 'x', `Pay all ${unpaid} unpaid orders · ${ugx(unpaidSum)}`, '', `data-orders="${esc(JSON.stringify(unpaidList))}"`)}</div>` : ''}${orders.map(card).join('') || '<div class="card">No orders yet.</div>'}`;
}
async function loadMsgs(card, id) {
  const ms = await run(sb.from('messages').select('*').eq('order_id', id).order('id'));
  const ids = [...new Set(ms.map(m => m.sender_id))];
  const ps = ids.length ? await run(sb.from('public_profiles').select('user_id,name').in('user_id', ids)) : [];
  card.querySelector('.msgbox').innerHTML = (ms.map(m => `<p><b>${m.sender_id === me.user_id ? 'You' : esc(ps.find(p => p.user_id === m.sender_id)?.name || '?')}</b>: ${esc(m.body)}</p>`).join('') || '<p class="muted">No messages yet.</p>')
    + `<form data-form="msg" data-id="${esc(id)}" class="row"><input name="body" maxlength="500" required aria-label="Message"><button>Send</button></form>`;
}

   <table><tr><td>${esc(l.produce)} · ${esc(o.qty_kg)} kg × ${ugx(l.price_ugx)}</td><td>${ugx(produce)}</td></tr>

// ---------- weather and advice (Open-Meteo, no key; needs internet)
const WX = c => c === 0 ? ['☀️', 'Clear'] : c <= 3 ? ['⛅', 'Partly cloudy'] : c <= 48 ? ['🌫', 'Fog'] : c <= 67 ? ['🌧', 'Rain'] : c <= 77 ? ['❄️', 'Snow'] : c <= 82 ? ['🌦', 'Showers'] : ['⛈', 'Thunderstorm'];
function adviceFor(d, role) {
  const day = i => new Date(d.time[i] + 'T12:00').toLocaleDateString('en-UG', { weekday: 'long' });
  const wet = [0, 1, 2].filter(i => (d.precipitation_probability_max[i] ?? 0) >= 60 || (d.precipitation_sum[i] ?? 0) >= 10);
  const hot = [0, 1, 2].filter(i => d.temperature_2m_max[i] >= 30);
  const dry = [0, 1, 2, 3, 4].every(i => (d.precipitation_sum[i] ?? 0) < 1);
  const t = [];
  if (wet.length) t.push(`Rain is likely on ${wet.map(day).join(' and ')}. ` + ({ farmer: 'Harvest and dry maize or beans before it, cover stored produce, and tell buyers if collection may be late.', agent: 'Tell the farmers you list for to harvest and cover produce early, and warn buyers of possible delays.', rider: 'Roads may be slow or muddy. Allow extra time and protect produce from the rain.', buyer: 'Deliveries may be late on wet days. Pick a time that suits you, and check the produce at handover.', admin: 'Expect more late-delivery disputes on wet days.' }[role] || ''));
  if (hot.length) t.push(`It will be hot (30°C or more) on ${hot.map(day).join(' and ')}. ` + ({ farmer: 'Harvest tomatoes and leafy vegetables early in the morning and keep them in the shade.', agent: 'Advise farmers to harvest perishables early and keep them shaded.', rider: 'Deliver perishables early in the day and keep them out of direct sun.', buyer: 'Perishables spoil faster in the heat. Collect early and confirm quickly.', admin: '' }[role] || ''));
  if (dry && !wet.length) t.push(({ farmer: 'A dry spell is forecast. It is a good time to dry maize and beans; consider watering vegetables.', agent: 'A dry spell is forecast. Good drying weather for grains; vegetables may need watering.', rider: 'Dry roads: normal delivery times.', buyer: 'Dry weather: good conditions for grain prices to stay steady and deliveries to run on time.', admin: '' }[role] || ''));
  if (!t.length) t.push('No special weather warning for the next few days.');
  return t.filter(Boolean);
}
async function viewWeather() {
  const c = ORIGIN?.c || townInfo(me?.town)?.c, name = ORIGIN ? 'your location (near ' + ORIGIN.name + ')' : me.town;
  if (!c) { $app.innerHTML = '<h2>Weather</h2><div class="card">Set your town in Profile first.</div>'; return; }
  $app.innerHTML = `${SET.weather_video_url || SET.img_weather ? `<section class="wx-hero">${SET.weather_video_url ? `<video autoplay muted loop playsinline aria-hidden="true" src="${esc(SET.weather_video_url)}"></video>` : ''}<h2>Weather and advice</h2></section>` : '<h2>Weather and advice</h2>'}<div class="card" id="wx">Loading the forecast for ${esc(name)}…</div>`;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=auto&forecast_days=5`);
    if (!r.ok) throw 0; const d = (await r.json()).daily;
    document.getElementById('wx').innerHTML = `<b>${esc(name)}: next 5 days</b><div class="wx" style="margin-top:.5rem">${d.time.map((t, i) => { const [ic, tx] = WX(d.weathercode[i]);
      return `<div><b>${esc(new Date(t + 'T12:00').toLocaleDateString('en-UG', { weekday: 'short' }))}</b><br><span style="font-size:1.6rem">${ic}</span><br>${esc(tx)}<br>${Math.round(d.temperature_2m_min[i])}–${Math.round(d.temperature_2m_max[i])}°C<br>💧 ${d.precipitation_probability_max[i] ?? 0}%</div>`; }).join('')}</div>
      <h3>Advice for a ${esc(me.role)}</h3><ul>${adviceFor(d, me.role).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <p class="muted">Forecast data from Open-Meteo. Tips are simple rules, not professional farming advice.</p>`;
  } catch { document.getElementById('wx').innerHTML = 'Could not load the forecast. Check your internet connection and try again.'; }
}

  if (tab === 'site') {
    const slot = ([key, title, def, cat]) => `<div class="slot"><div class="thumb" style="background-image:${SET[key] ? cssUrl(SET[key]) : cat ? cssUrl(art(cat)) : def}"></div><label for="im_${key}">${esc(title)}</label>
      <input id="im_${key}" name="${key}" type="file" accept="image/*">${SET[key] ? btn('imgoff', key, key === 'logo_url' ? 'Remove logo' : 'Use sample picture', 'alt') : '<span class="muted">Sample picture in use</span>'}</div>`;
    return `<h2 style="margin-top:0">Pictures and wording</h2><div class="card"><form data-form="look">
      <label for="tg">Headline on the home page</label><input id="tg" name="tagline" maxlength="120" value="${esc(SET.tagline ?? '')}">
      <div class="row"><div><label for="pt">Promo banner title</label><input id="pt" name="promo_title" maxlength="80" value="${esc(SET.promo_title ?? '')}" placeholder="Have produce to sell?"></div>
      <div><label for="px">Promo banner text</label><input id="px" name="promo_text" maxlength="200" value="${esc(SET.promo_text ?? '')}"></div></div>
      <h3 style="margin-top:1rem">Pictures</h3><p class="muted">Pick a picture for any slot, then save. Images up to 10 MB are supported. Weather background videos may be MP4/WebM/MOV up to 30 MB. Produce without its own photo shows its category picture.</p>
      <div class="slots">${IMG_SLOTS.map(slot).join('')}</div><div class="slot"><div class="thumb" style="background-image:${SET.weather_video_url ? cssUrl(SET.weather_video_url) : 'var(--img-weather)'}"></div><label for="weather_video_url">Weather background video (optional)</label><input id="weather_video_url" name="weather_video_url" type="file" accept="video/mp4,video/webm,video/quicktime">${SET.weather_video_url ? btn('imgoff', 'weather_video_url', 'Remove video', 'alt') : '<span class="muted">Use the weather image or default background</span>'}</div><button>Save pictures and wording</button></form></div>
      <h2>Fees and rules</h2><div class="card"><form data-form="sitesettings">
      <div class="row"><div><label for="s1">Delivery fee (UGX)</label><input id="s1" name="delivery_fee_ugx" type="number" min="0" max="50000" value="${esc(SET.delivery_fee_ugx ?? 3000)}"></div>
      <div><label for="s2">Platform fee (%)</label><input id="s2" name="platform_fee_pct" type="number" min="0" max="20" step="0.5" value="${esc(SET.platform_fee_pct ?? 5)}"></div>
      <div><label for="s3">Rider share of delivery fee (%)</label><input id="s3" name="rider_share_pct" type="number" min="0" max="100" value="${esc(SET.rider_share_pct ?? 90)}"></div>
      <div><label for="s4">Auto-confirm after (hours)</label><input id="s4" name="auto_release_hours" type="number" min="1" max="720" value="${esc(SET.auto_release_hours ?? 48)}"></div></div>
      <label for="s5">Banner message for all users (optional)</label><input id="s5" name="banner" maxlength="200" value="${esc(SET.banner ?? '')}"><button>Save settings</button>
      <p class="muted">New values apply to new orders. The auto-confirm hours apply when the scheduled job runs.</p></form></div>`;
  }
  if (tab === 'feedback') {
    const fbs = await run(sb.from('feedback').select('*').order('id', { ascending: false }).limit(50));
    return `<h2 style="margin-top:0">Feedback</h2>${fbs.map(x => `<div class="card"><span class="tag">${esc(x.kind)}</span> <span class="tag ${x.status === 'resolved' ? '' : 'warn'}">${esc(x.status)}</span><p>${esc(x.message)}</p><div class="muted">${esc(x.created_at.slice(0, 10))}</div>
      ${x.status !== 'resolved' ? `<div class="row">${x.status === 'new' ? btn('fbstatus', x.id, 'Mark seen', 'alt', 'data-s="seen"') : ''}${btn('fbstatus', x.id, 'Resolve', '', 'data-s="resolved"')}</div>` : ''}</div>`).join('') || '<div class="card">No feedback yet.</div>'}`;
  }
  const log = await run(sb.from('audit_log').select('*').order('log_id', { ascending: false }).limit(100));
  return `<h2 style="margin-top:0">Audit log</h2><div class="card muted">${log.map(x => `${esc(x.logged_at.slice(0, 19).replace('T', ' '))} · ${esc(x.action)}`).join('<br>') || 'Empty'}</div>`;
}

// ---------- events
const QUIET = new Set(['fillgps', 'wish', 'tocart', 'msgs', 'csv', 'forgot', 'report']);   // actions that do not re-render the page
$app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id } = b.dataset, card = b.closest('.card'); b.disabled = true;
  try {
    const rpc = (fn, args, msg) => run(sb.rpc(fn, args), msg);
    if (act === 'switch') return viewAuth(id);
    if (act === 'more') { SHOWN += 24; return route(); }
    if (act === 'retry') { if (me?.role === 'agent' && me.approval_status !== 'approved') await loadMe(); return route(); }
    if (act === 'imgoff') { await run(sb.rpc('admin_set_setting', { p_key: id, p_value: '' }), 'Picture reset'); await loadSettings(); return route(); }
    if (!me && ['tocart', 'wish', 'needlogin'].includes(act)) return needLogin();
    if (act === 'cat') { SHOWN = 24; F = { ...F0, category: id }; const same = location.hash === '#/market'; location.hash = '#/market'; if (same) route(); return; }
    if (act === 'clear') { SHOWN = 24; F = { ...F0 }; return route(); }
    if (act === 'google') {
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (error) { toast('Google sign-in is not set up yet: ' + error.message, true); b.disabled = false; } return;
    }
    if (act === 'fillgps') {
      const f = b.closest('form') || $app.querySelector('form');
      if (!navigator.geolocation) { toast('This browser cannot share your location', true); b.disabled = false; return; }
      const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 10000 })).catch(() => null);
      if (!pos) { toast('Could not get your location. Allow location access, or pick your town below.', true); b.disabled = false; return; }
      const c = [pos.coords.latitude, pos.coords.longitude], t = ALLTOWNS.map(x => ({ ...x, d: km(c, x.c) })).sort((a, z) => a.d - z.d)[0];
      for (const [n, v] of [['region', t.r], ['district', t.d], ['town', t.n]]) { f.elements[n].value = v; f.elements[n].dispatchEvent(new Event('change')); }
      toast(`Nearest listed town: ${t.n} (${Math.round(t.d)} km away). Change it below if it is wrong.`); b.disabled = false; return;
    }
    if (act === 'mapview') { MAPVIEW = !MAPVIEW; return route(); }
    if (act === 'gpsoff') { ORIGIN = null; toast('Using your profile town again'); return route(); }
    if (act === 'gps') {
      if (!navigator.geolocation) { toast('This browser cannot share your location', true); b.disabled = false; return; }
      const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: false, timeout: 10000 })).catch(() => null);
      if (!pos) { toast('Could not get your location. Allow location access, or pick a town instead.', true); b.disabled = false; return; }
      const c = [pos.coords.latitude, pos.coords.longitude], near = ALLTOWNS.map(t => ({ ...t, d: km(c, t.c) })).sort((a, b) => a.d - b.d)[0];
      ORIGIN = { c, name: near.n }; toast(`Location found. Nearest listed town: ${near.n} (${Math.round(near.d)} km)`); return route();
    }
    if (act === 'alerts') { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Phone alerts allowed' : 'Alerts not allowed'); return route(); }
    if (act === 'fbstatus') { await run(sb.rpc('admin_feedback_status', { p_id: +id, p_status: b.dataset.s }), 'Feedback updated'); return route(); }
    if (act === 'forgot') {
      const em = $app.querySelector('[name=email]').value.trim(); if (!em) { toast('Type your email first', true); }
      else { await run(sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname }), 'If that email exists, a reset link was sent.'); }
    } else if (act === 'wish') {
      const on = b.getAttribute('aria-pressed') === 'true';
      await run(on ? sb.from('wishlist').delete().eq('listing_id', id) : sb.from('wishlist').insert({ user_id: me.user_id, listing_id: id }));
      b.setAttribute('aria-pressed', !on); b.textContent = on ? '♡ Save' : '♥ Saved';
    } else if (act === 'tocart') {
      const q = +(b.closest('form')?.elements.qty?.value || 1);
      await run(sb.from('cart_items').upsert({ user_id: me.user_id, listing_id: id, qty: q }, { onConflict: 'user_id,listing_id' }), 'Added to cart'); nav();
    } else if (act === 'cartqty') { await run(sb.from('cart_items').update({ qty: +card.querySelector('input').value }).eq('listing_id', id), 'Cart updated'); await route(); return; }
    else if (act === 'cartdel') { await run(sb.from('cart_items').delete().eq('listing_id', id)); await route(); return; }
    else if (act === 'reorder') {
      await run(sb.from('cart_items').upsert({ user_id: me.user_id, listing_id: b.dataset.listing, qty: +b.dataset.qty }, { onConflict: 'user_id,listing_id' }), 'Added to cart');
      location.hash = '#/cart'; return;
    } else if (act === 'msgs') { const box = card.querySelector('.msgbox'); if (box.innerHTML) box.innerHTML = ''; else await loadMsgs(card, id); }
    else if (act === 'csv') {
      const rows = [['order', 'date', 'produce', 'kg', 'sale_ugx', 'fee_ugx', 'net_ugx', 'status'], ...SALES.map(s => [s.id, s.date, s.produce, s.qty, s.gross, s.fee, s.net, s.status])];
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' }));
      a.download = 'lima-sales.csv'; a.click();
    }
    else if (act === 'pay') { openPay({ id, total_ugx: +b.dataset.total }, () => route()); b.disabled = false; return; }
    else if (act === 'payall') { openPay(JSON.parse(b.dataset.orders), () => route()); b.disabled = false; return; }
    else if (act === 'confirm') await rpc('confirm_receipt', { p_order: id }, 'Receipt confirmed. Payment released to the farmer.');
    else if (act === 'accept') await rpc('farmer_step', { p_order: id, p_to: 3 }, 'Order accepted');
    else if (act === 'ready') await rpc('farmer_step', { p_order: id, p_to: 4 }, 'Marked ready');
    else if (act === 'handover') await rpc('pickup_handover', { p_order: id }, 'Handed over');
    else if (act === 'collect') await rpc('rider_step', { p_order: id, p_to: 5 }, 'Collected');
    else if (act === 'deliver') await rpc('rider_step', { p_order: id, p_to: 6 }, 'Marked delivered');
    else if (act === 'rate') await rpc('rate_order', { p_order: id, p_ratee: b.dataset.ratee, p_stars: +card.querySelector('select').value, p_comment: card.querySelector('textarea').value.trim() || null }, 'Thanks for rating');
    else if (act === 'setrole') await rpc('admin_set_role', { p_user: id, p_role: b.closest('tr').querySelector('select').value }, 'Role updated');
    else if (act === 'approveagent') await rpc('admin_approve_agent', { p_user: id }, 'Village-agent account approved');
    else if (act === 'savelisting') { const tr = b.closest('tr'); const upd = { price_ugx: +tr.querySelector('[name=price]').value, qty_kg: +tr.querySelector('[name=qty]').value }; const ph = tr.querySelector('[name=photo]')?.files?.[0]; if (ph) upd.photo_url = await upload(ph, 'listing'); await run(sb.from('listings').update(upd).eq('listing_id', id), 'Listing updated'); }
    else if (act === 'listphotooff') { await run(sb.from('listings').update({ photo_url: null }).eq('listing_id', id), 'Photo removed'); }
    else if (act === 'dellisting') {
      if (!confirm('Remove this listing from the marketplace? Existing order history will be preserved.')) { b.disabled = false; return; }
      const linked = await sb.from('orders').select('order_id', { count: 'exact', head: true }).eq('listing_id', id);
      if (linked.error) throw linked.error;
      if ((linked.count || 0) > 0) {
        await run(sb.from('listings').update({ qty_kg: 0 }).eq('listing_id', id), 'Listing hidden; its order history was preserved');
      } else {
        const del = await sb.from('listings').delete().eq('listing_id', id);
        if (del.error && (del.error.code === '23503' || /orders_listing_id_fkey/i.test(del.error.message || ''))) {
          await run(sb.from('listings').update({ qty_kg: 0 }).eq('listing_id', id), 'Listing hidden; its order history was preserved');
        } else if (del.error) { toast(del.error.message, true); throw del.error; }
        else toast('Listing removed');
      }
    }
    else if (act === 'delprice') await run(sb.from('market_prices').delete().eq('price_id', id), 'Price removed');
    else if (act === 'herooff') { await rpc('admin_set_setting', { p_key: 'hero_image_url', p_value: '' }, 'Picture reset'); await loadSettings(); }
    else if (act === 'decide') await rpc('admin_decide', { p_dispute: id, p_decision: b.dataset.d }, 'Decision recorded');
    else if (act === 'report') {
      card.querySelector('.acts').innerHTML = `<label>What went wrong?</label><textarea rows="3" minlength="5" required></textarea><label>Photo evidence</label><input type="file" accept="image/*" capture="environment">${btn('sendreport', id, 'Submit problem', 'danger')}`;
    } else if (act === 'sendreport') {
      const reason = card.querySelector('textarea').value, url = await upload(card.querySelector('input[type=file]').files[0], 'evidence');
      await rpc('report_problem', { p_order: id, p_reason: reason, p_evidence: url }, 'Problem reported. Payment is frozen while Lima reviews.');
    }
    if (QUIET.has(act)) { b.disabled = false; return; }
    await route();
  } catch { b.disabled = false; }
});
$app.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, v = Object.fromEntries(new FormData(f)), k = f.dataset.form, bt = f.querySelector('button:not([type=button])'); bt.disabled = true;
  try {
    if (k === 'login') { await run(sb.auth.signInWithPassword({ email: v.email, password: v.pw })); await loadMe(); if (NEXT) { location.hash = NEXT; NEXT = null; } }
    else if (k === 'register') {
      if (!/^0\d{9}$/.test(v.phone)) { toast('Phone must be 10 digits starting with 0', true); throw 0; }
      const d = await run(sb.auth.signUp({ email: v.email, password: v.pw, options: { data: { name: v.name, phone_no: v.phone, role: v.role, region: v.region, district: v.district, town: v.town, market: v.market } } }));
      if (!d.session) { toast('Account created. Confirm the email we sent, then sign in.'); return viewAuth('login'); }
      await loadMe();
    } else if (k === 'verify') { await run(sb.rpc('verify_phone', { p_code: v.code }), 'Phone verified'); await loadMe(); }
    else if (k === 'newpw') { await run(sb.auth.updateUser({ password: v.pw }), 'Password updated'); recovering = false; await loadMe(); f.reset(); }
    else if (k === 'homesearch') { SHOWN = 24; F = { ...F0, produce: v.produce.trim() }; location.hash = '#/market'; return; }
    else if (k === 'filter') { SHOWN = 24; F = { produce: v.produce.trim(), category: v.category, district: v.district, town: v.town, market: v.market, radius: v.radius, min: v.min, max: v.max, sort: v.sort }; }
    else if (k === 'onboard') {
      if (!/^0\d{9}$/.test(v.phone)) { toast('Phone must be 10 digits starting with 0', true); throw 0; }
      await run(sb.rpc('complete_profile', { p_role: v.role, p_phone: v.phone, p_region: v.region, p_district: v.district, p_town: v.town, p_market: v.market }), 'Profile saved'); await loadMe();
    }
    else if (k === 'look') {
      for (const [key] of IMG_SLOTS) { const fl = f.elements[key]?.files?.[0]; if (fl) { const url = await upload(fl, 'site'); await run(sb.rpc('admin_set_setting', { p_key: key, p_value: url })); } }
      const weatherVideo = f.elements.weather_video_url?.files?.[0]; if (weatherVideo) { const url = await upload(weatherVideo, 'weather-video'); await run(sb.rpc('admin_set_setting', { p_key: 'weather_video_url', p_value: url })); }
      for (const key of ['tagline', 'promo_title', 'promo_text']) if ((v[key] || '') !== (SET[key] || '')) await run(sb.rpc('admin_set_setting', { p_key: key, p_value: v[key] || '' }));
      await loadSettings(); toast('Saved');
    }
    else if (k === 'feedback') { await run(sb.rpc('send_feedback', { p_kind: v.kind, p_message: v.message }), 'Thank you. Your feedback was sent.'); }
    else if (k === 'prefs') {
      PREFS.big = !!v.big; savePrefs();
      await run(sb.from('profiles').update({ sms_opt_in: !!v.sms }).eq('user_id', me.user_id), 'Settings saved'); await loadMe();
    } else if (k === 'sitesettings') {
      for (const key of ['delivery_fee_ugx', 'platform_fee_pct', 'rider_share_pct', 'auto_release_hours', 'banner']) if (String(v[key] ?? '') !== String(SET[key] ?? '')) await run(sb.rpc('admin_set_setting', { p_key: key, p_value: String(v[key] ?? '') }));
      await loadSettings(); toast('Site settings saved');
    }
    else if (k === 'order') { await run(sb.rpc('place_order', { p_listing: f.dataset.id, p_qty: +v.qty, p_mode: v.mode }), 'Order placed. Now pay into escrow.'); location.hash = '#/orders'; return; }
    else if (k === 'checkout') { const n = await run(sb.rpc('checkout', { p_mode: v.mode })); toast(`${n} order${n > 1 ? 's' : ''} placed. Pay them below.`); location.hash = '#/orders'; return; }
    else if (k === 'msg') { await run(sb.rpc('send_message', { p_order: f.dataset.id, p_body: v.body })); await loadMsgs(f.closest('.card'), f.dataset.id); return; }
    else if (k === 'profile') {
      if (!/^0\d{9}$/.test(v.phone)) { toast('Phone must be 10 digits starting with 0', true); throw 0; }
      await run(sb.from('profiles').update({ name: v.name.trim(), phone_no: v.phone, region: v.region, district: v.district, town: v.town, market: v.market }).eq('user_id', me.user_id), 'Profile saved'); await loadMe();
    } else if (k === 'sell') {
      const url = await upload(f.elements.photo.files[0], 'listing');
      await run(sb.from('listings').insert({ farmer_id: v.farmer || me.user_id, posted_by: me.user_id, produce: v.produce.trim(), category: v.category, qty_kg: +v.qty, price_ugx: +v.price, harvest_date: v.harvest, district: v.district, town: v.town, market: v.market || null, photo_url: url }), 'Listing published');
    } else if (k === 'price') {
      const ex = PRICES.find(p => p.produce.toLowerCase() === v.produce.trim().toLowerCase());
      await run(ex ? sb.from('market_prices').update({ avg_price_ugx: +v.price, as_of: new Date().toISOString().slice(0, 10) }).eq('price_id', ex.price_id)
                   : sb.from('market_prices').insert({ produce: v.produce.trim(), avg_price_ugx: +v.price }), 'Price saved');
    }
    await route();
  } catch { bt.disabled = false; }
});
$app.addEventListener('input', e => {
  if (e.target.id === 'uq') { const q = e.target.value.toLowerCase(); $app.querySelectorAll('tr[data-s]').forEach(r => r.hidden = !r.dataset.s.includes(q)); }
  if (e.target.name === 'produce' && e.target.closest('[data-form=sell]')) {
    const p = PRICES.find(x => x.produce.toLowerCase() === e.target.value.trim().toLowerCase());
    document.getElementById('hint').textContent = p ? `Market price today: ${ugx(p.avg_price_ugx)}/kg` : '';
  }
});
const tb = document.getElementById('themebtn');
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem('lima_theme', t); } catch {}
  tb.textContent = t === 'dark' ? '☀️' : '🌙'; tb.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0a2a1e' : '#0d3b2a'; };
tb.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); setTheme(document.documentElement.dataset.theme || 'light');
document.getElementById('hsearch').addEventListener('submit', e => { e.preventDefault(); SHOWN = 24; F = { ...F0, produce: new FormData(e.target).get('q').trim() };
  const same = location.hash === '#/market'; location.hash = '#/market'; if (same) route(); });
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { recovering = true; route(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('hashchange', route);
await loadSettings(); await loadMe();
if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);   // tidy the URL after a Google sign-in
route();
</script>
